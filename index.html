<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF6 RedSec - Dynamic Regional Proportion Radar</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #f87171;
            --border: #334155;
            --chart-grid: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn-group {
            display: flex;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .btn-group button {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-group button.active {
            background: var(--accent);
            color: #000;
        }

        .refresh-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .refresh-btn:hover {
            background: var(--border);
        }

        .status-banner {
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.1) 0%, rgba(30, 41, 59, 0) 100%);
            border-left: 4px solid var(--accent);
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .status-banner .live-count {
            font-size: 20px;
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .abstract p {
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .abstract p:last-child {
            margin-bottom: 0;
        }
        .abstract h2 {
            margin-top: 0;
            font-size: 18px;
            color: var(--text-main);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .region-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .region-name {
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }

        .region-time {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .badge {
            background: var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.ping {
            background: rgba(74, 222, 128, 0.1);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .badge.ping.medium {
            background: rgba(251, 191, 36, 0.1);
            color: var(--warning);
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .badge.holiday {
            background: var(--warning);
            color: #000;
        }

        .badge.eve {
            background: var(--accent);
            color: #000;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 20px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .progress-bar {
            height: 6px;
            background: #000;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
            display: flex;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.5s ease-out;
        }

        .progress-fill-redsec {
            height: 100%;
            background: #64748b; 
            transition: width 0.5s ease-out;
        }

        /* Scrollable Chart Container Styles */
        .chart-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 8px;
        }

        .chart-container-inner {
            min-width: 800px;
            height: 320px;
        }

        .scroll-hint {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
            margin-bottom: 8px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📡 BF6 RedSec Regional Proportion Radar</h1>
        <div class="controls">
            <div class="btn-group">
                <button id="btn-pc" class="active" onclick="setPlatformMode('pc')">💻 PC Only</button>
                <button id="btn-cross" onclick="setPlatformMode
